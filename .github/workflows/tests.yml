name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }}${{ matrix.deps == 'lowest' && ' / lowest deps' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        symfony: [ '^5.4', '^6.4' ]
        deps: [ highest, lowest ]
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: json, libxml
        coverage: none
        tools: composer:v2

    - name: Install dependencies
      run: |
        composer remove --dev roave/security-advisories --no-update
        composer require \
          'symfony/config:${{ matrix.symfony }}' \
          'symfony/console:${{ matrix.symfony }}' \
          'symfony/dependency-injection:${{ matrix.symfony }}' \
          'symfony/http-kernel:${{ matrix.symfony }}' \
          'symfony/options-resolver:${{ matrix.symfony }}' \
          'symfony/process:${{ matrix.symfony }}' \
          --no-update
        composer require --dev \
          'symfony/framework-bundle:${{ matrix.symfony }}' \
          'symfony/yaml:${{ matrix.symfony }}' \
          --no-update
        # jms/serializer < 3.14 has a class named ReadOnly, which does not parse on PHP 8.1+
        if [ '${{ matrix.deps }}' = 'lowest' ]; then composer require 'jms/serializer:^3.14' --no-update; fi
        composer update --prefer-dist --no-progress --no-security-blocking ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

    - name: PHPUnit
      run: composer test
